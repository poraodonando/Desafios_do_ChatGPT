<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header>

        <img src="img/flix.png" alt="" class="flix">
        
        <ul>
            <div class="item">
                <li>Filmes</li>
            </div>
            <div class="item">
                <li>Series</li>
            </div>
            <div class="item">
                <li>Ao Vivo</li>
            </div>
            <li></li>
        </ul>
        
        
    </header>

    <main>
        <div class="catalogo">
            <div class="cards">
                <img src="img/power.png" alt="Power Rangers: O Filme">
                <p class="titulo">Power Rangers: O Filme</p>
                <p class="genero">Ação</p>
                <p class="ano">1995</p>
                <button class="botao">Assita agora</button>
            </div>
            <div class="cards">
                <img src="img/branquelas.png" alt="As Branquelas">
                <p class="titulo">As Branquelas</p>
                <p class="genero">Comédia</p>
                <p class="ano">2002</p>
                <button class="botao">Assita agora</button>
            </div>
            <div class="cards">
                <img src="img/jogos.png" alt="Jogos Mortais">
                <p class="titulo">Jogos Mortais</p>
                <p class="genero">Terror/Suspense</p>
                <p class="ano">2012</p>
                <button class="botao">Assista Agora</button>
            </div>
            <div class="cards">
                <img src="img/vida.png" alt="Ai que vida!">
                <p class="titulo">Ai que vida!</p>
                <p class="genero">Comedia</p>
                <p class="ano">2007</p>
                <button class="botao">Assista agora</button>
            </div>
            <div class="cards">
                <img src="img/volta.png" alt="A volta ao mundo em 80 dias">
                <p class="titulo">A volta ao mundo em 80 dias</p>
                <p class="genero">Aventura</p>
                <p class="ano">2015</p>
                <button class="botao">Assista agora</button>
            </div>
            <div class="cards"><img src="img/estrelas.png" alt="Caçadores de Estrelas">
                <p class="titulo">Caçadores de Estrelas</p>
                <p class="genero">Ficção Científica</p>
                <p class="ano">2026</p>
                <button class="botao">Assista agora</button>
            </div>
        </div>
    </main>

</body>
</html>
