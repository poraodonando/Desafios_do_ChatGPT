<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Cadastro de matemáticos</h1>

    <form action="" id="formulario">

        <fieldset id="">
            
            <label for="nome">Nome</label>
            <input type="text" name="" id=""> <br>
    
            <label for="email">E-mail</label>
            <input type="email" name="" id="">

            <label for="nascimento">Data de Nascimento</label>
            <input type="date" name="" id="">
        </fieldset>

        <fieldset>
            <label for="matematicoFav"><p>Matemáticos Favoritos:</p></label>
            <input type="checkbox" name="" id="" value="Pitagoras">Pitagoras
            <input type="checkbox" name="" id="" value="Arquimedes">Arquimedes
            <input type="checkbox" name="" id="" value="Euclides">Euclides
            <input type="checkbox" name="" id="" value="Newton">Newton
            
            <br>

            <label for="">Area Favorita: </label>
            <input type="radio" name="areaFav" id="">Algebra
            <input type="radio" name="areaFav" id="">Geometria
            <input type="radio" name="areaFav" id="">Estatistica
            <input type="radio" name="areaFav" id="">Fisica Matemática

            <p>Biografia: </p>
            <textarea name="" id=""></textarea> <br>

            <button type="button">Enviar</button>


            


        </fieldset>


    </form>
    
</body>
</html>
